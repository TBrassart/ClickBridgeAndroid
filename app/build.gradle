plugins {
    id 'com.android.application'
}

android {
    namespace 'app.clickbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'app.clickbridge'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
